# .github/workflows/nhl.yml
# Downloads NHL box scores every hour overnight and commits the tables to data/.
# Needs only nhl_ingest.py in the top folder of the repo.
name: nhl

on:
  schedule:
    - cron: "17 1-11 * * *"           # hourly 01:17-11:17 UTC; games end 02:00-06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nhl-data
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NHL_CACHE: cache
  NHL_OUT: data

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy requests duckdb

      - uses: actions/cache/restore@v4
        with:
          path: cache
          key: nhl-cache-${{ github.run_id }}
          restore-keys: nhl-cache-

      - name: Ingest box scores
        id: ingest
        continue-on-error: true
        run: |
          mkdir -p cache data
          python nhl_ingest.py 2>&1 | tee ingest.log
        env:
          PROLYT_API_KEY: ${{ secrets.PROLYT_API_KEY }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: cache
          key: nhl-cache-${{ github.run_id }}

      - name: Commit the tables
        run: |
          git config user.name  "nhl-bot"
          git config user.email "nhl-bot@users.noreply.github.com"
          if ls data/nhl_*.csv >/dev/null 2>&1; then git add -f data/nhl_*.csv; fi
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -m "nhl data $(date -u +%F\ %H:%M)"
            git pull --rebase
            git push
          fi

      - name: Fail the run if the ingest failed
        if: steps.ingest.outcome == 'failure'
        run: |
          echo "::error::nhl_ingest.py failed; its last lines:"
          tail -15 ingest.log || true
          exit 1
